<!DOCTYPE html>
<html>
<head>
<title>2473033 - KristianDavid</title>

<script src="jquery.js"></script>

<script src="SIJson.js"></script>

<style>

body{
    font-family:Times New Roman;
}

#inputbox{
    width:400px;
    padding:10px;
    border:1px solid black;
    margin-bottom:20px;
    box-shadow:0px 0px 10px gray;
}

input[type=text]{
    width:380px;
    margin-bottom:5px;
}

#hasil{
    width:620px;
    border:1px solid black;
}

#portal{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    padding:20px;
    border-bottom:1px solid black;
}

.item{
    padding:10px;
    border-bottom:1px solid gray;
}

#footer{
    padding:5px;
}

</style>

<script>

$(document).ready(function(){

    $("#look").click(function(){

        var html = "";

        html += "<div id='portal'>";

        html += "<a href='"+data.link+"' target='_blank'>";
        html += data.title;
        html += "</a>";

        html += "</div>";

        $.each(data.items,function(i,item){

            html += "<div class='item'>";

            html += "<a href='"+item.link+"' target='_blank'>";
            html += item.title;
            html += "</a><br>";

            html += "By : "+item.author+
                    " / <i>"+item.published+"</i>";

            html += "<br><br>";

            html += item.description;

            html += "<br><br>";

            html += "Universitas : ";

            html += "<a href='"+item.universitas.m+"' target='_blank'>";
            html += "Click Here";
            html += "</a>";

            html += "<br>";

            html += "Tag(s) : "+item.tags;

            html += "</div>";

        });

        html += "<div id='footer'>";
        html += "©SI-SI FIT UKM";
        html += "</div>";

        $("#hasil").html(html);

    });

});

</script>

</head>

<body>

<input type="text" value="Title"><br>

<input type="text" value="Content"><br>

<input type="text" value="Generator"><br><br>

<input type="button" value="Look" id="look">

</div>

<div id="hasil"></div>

</body>
</html>
