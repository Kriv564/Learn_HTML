<!DOCTYPE html>
<html>
<head>
<title>2473033 - Kristian David</title>

<script src="jquery-4.0.0.min.js"></script>

<style>

body{
    font-family:Arial;
}

#menu{
    width:500px;
    margin:50px auto;
    padding:10px;
    background:#eee;
    box-shadow:0px 0px 10px gray;
}

#menu ol{
    margin:0;
    padding:0;
}

#menu ol li{
    list-style:none;
    float:left;
    width:120px;
    margin-right:5px;
    background:#ff3399;
    position:relative;
}

#menu ol li a{
    color:white;
    text-decoration:none;
    display:block;
    padding:3px;
}

#menu ol li ol{
    position:absolute;
    top:25px;
    left:0;
    width:120px;
    background:white;
    border:2px solid #ff3399;
    padding:0;
}

#menu ol li ol li{
    float:none;
    background:white;
    margin:0;
    width:120px;
}

#menu ol li ol li a{
    color:black;
    padding:2px;
}

#menu ol li ol li a:hover{
    background:#ff3399;
    color:white;
}

.clear{
    clear:both;
}

</style>

<script>

$(document).ready(function(){

    $("#menu ol li ol").hide();

    $("#menu ol li").hover(

        function(){
            $(this).children("ol").show();
        },

        function(){
            $(this).children("ol").hide();
        }

    );

});

</script>

</head>

<body>

<div id="menu">

<ol>

    <li>
        <a href="#">jQuery</a>

        <ol>
            <li><a href="#">Download</a></li>
            <li><a href="#">Documentation</a></li>
            <li><a href="#">Blog</a></li>
        </ol>

    </li>

    <li>
        <a href="#">Community</a>

        <ol>
            <li><a href="#">Mailing List</a></li>
            <li><a href="#">Tutorials</a></li>
            <li><a href="#">Demos</a></li>
            <li><a href="#">Plugins</a></li>
        </ol>

    </li>

    <li>
        <a href="#">Development</a>

        <ol>
            <li><a href="#">Source Code</a></li>
            <li><a href="#">Bug Tracking</a></li>
            <li><a href="#">Recent Changes</a></li>
        </ol>

    </li>

</ol>

<div class="clear"></div>

</div>

</body>
</html>
