<!DOCTYPE html>
<html>
<head>
<title>2473033 - Kristian David</title>

<script src="jquery-4.0.0.min.js"></script>

<style>

body{
    font-family:Arial;
}

#box{
    width:60px;
    margin:50px auto;
    padding:20px;
    background:#eee;
    box-shadow:0px 0px 10px gray;
}

table{
    border-collapse:collapse;
}

td{
    width:50px;
    text-align:center;
    border:1px solid black;
    padding:10px;
}

</style>

<script>

$(document).ready(function(){

    $(".header").click(function(){

        var flag = $(this).attr("checked");

        if(flag){

            $("input:checkbox.body")
            .attr("checked","checked");

        }

        else{

            $("input:checkbox.body")
            .removeAttr("checked");

        }

    });

});

</script>

</head>

<body>

<div id="box">

<table cellpadding="0" cellspacing="0">

<tr>
<td>

<input class="header" type="checkbox">

<br><hr><br>

<input class="body" type="checkbox"><br><br>

<input class="body" type="checkbox"><br><br>

<input class="body" type="checkbox"><br><br>

<input class="body" type="checkbox"><br><br>

<input class="body" type="checkbox">

</td>
</tr>

</table>

</div>

</body>
</html>
