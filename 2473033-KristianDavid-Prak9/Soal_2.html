<!DOCTYPE html>
<html>
<head>
<title>2473033 - Kristian David</title>

<script src="jquery-4.0.0.min.js"></script>

<style>

body{
    font-family:Arial;
}

#box{
    width:300px;
    margin:50px auto;
    padding:10px;
    background:#eee;
    box-shadow:0px 0px 10px gray;
}

#txtNama{
    width:150px;
}

.nama{
    margin-top:5px;
}

.cari{
    text-decoration:underline;
}

</style>

<script>

$(document).ready(function(){

    $("#btnAdd").click(function(){

        var nama = $("#txtNama").val();

        if(nama != ""){
            $("#listNama").append(
                "<div class='nama'>" + nama + "</div>"
            );

            $("#txtNama").val("");
        }

    });

    $("#btnSearch").click(function(){

        var cari = $("#txtNama").val().toLowerCase();

        $(".nama").removeClass("cari");

        $(".nama").each(function(){

            var isi = $(this).text().toLowerCase();

            if(isi.indexOf(cari) != -1 && cari != ""){
                $(this).addClass("cari");
            }

        });

    });

});

</script>

</head>

<body>

<div id="box">

<input type="text" id="txtNama">

<input type="button" value="Add" id="btnAdd">

<input type="button" value="Search" id="btnSearch">

<div id="listNama">

    <div class="nama">John Resig</div>
    <div class="nama">George Martin</div>
    <div class="nama">Malcom John Sinclair</div>
    <div class="nama">J. Ohn</div>

</div>

</div>

</body>
</html>
